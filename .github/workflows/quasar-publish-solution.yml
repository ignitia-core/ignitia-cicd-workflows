# This reusable workflow standardizes Quasar web application publishing.
# Supports:
# - Building Quasar SPA applications
# - Creating GitHub releases with packaged artifacts
# - Optionally bumping environment repositories
#
# Assumes:
# - Quasar project at repository root
# - GitHub OIDC federation configured with AWS IAM role (for Parameter Store access)

name: quasar-publish-solution

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      application:
        type: string
        required: true
        description: "Base app name (without api/contract/ui postfix)"
      node-version:
        type: string
        required: false
        default: "20"
        description: "Node.js version"
      aws-region:
        type: string
        required: false
        default: "eu-west-1"
        description: "AWS region"
      aws-role-arn:
        type: string
        required: true
        description: "IAM role ARN for GitHub OIDC"
      aws-parameter-store-github-pat:
        type: string
        required: false
        default: "/ignitia/global/github-pat"
        description: "Parameter Store path for GitHub PAT (cross-repo operations)"
      secret-placeholders:
        type: string
        required: false
        default: ""
        description: "Tilde-separated Parameter Store paths to fetch and use as {{KEY}} placeholders"
      repository:
        type: string
        required: true
        description: "Target repo (org/repo) to publish from"
      env-repo-suffix:
        type: string
        required: false
        default: "environment"
        description: "Suffix for environment repo (e.g., 'environment' results in '{app}-environment')"
      source-folder:
        type: string
        required: false
        default: "./workflow/repository"
        description: "Source folder for Quasar build"

jobs:
  quasar-publish-solution:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      # -------------------- AWS OIDC Authentication --------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Fetch GitHub PAT from Parameter Store
        id: github-pat
        run: |
          set -euo pipefail
          PAT=$(aws ssm get-parameter \
            --name "${{ inputs.aws-parameter-store-github-pat }}" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)
          if [ -z "$PAT" ]; then
            echo "❌ Missing GitHub PAT in Parameter Store"
            exit 1
          fi
          echo "::add-mask::$PAT"
          echo "value=$PAT" >> "$GITHUB_OUTPUT"
          echo "✅ Fetched GitHub PAT"

      # -------------------- Checkout --------------------
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          token: ${{ steps.github-pat.outputs.value }}
          path: workflow/repository
          fetch-depth: 0

      # -------------------- Placeholder Replacement --------------------
      - name: Fetch secrets from Parameter Store
        if: inputs.secret-placeholders != ''
        id: placeholders
        run: |
          set -euo pipefail
          
          PATHS="${{ inputs.secret-placeholders }}"
          IFS='~' read -ra PATH_ARRAY <<< "$PATHS"
          
          KEYS=""
          VALUES=""
          
          for path in "${PATH_ARRAY[@]}"; do
            if [ -z "$path" ]; then continue; fi
            
            echo "📦 Fetching: $path"
            value=$(aws ssm get-parameter \
              --name "$path" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text)
            
            if [ -z "$value" ]; then
              echo "❌ Empty value for $path"
              exit 1
            fi
            
            key=$(basename "$path")
            echo "::add-mask::$value"
            
            KEYS="${KEYS}${key}~"
            VALUES="${VALUES}${value}~"
          done
          
          KEYS="${KEYS%~}"
          VALUES="${VALUES%~}"
          
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"
          echo "values=$VALUES" >> "$GITHUB_OUTPUT"
          echo "✅ Fetched $(echo "$KEYS" | tr '~' '\n' | wc -l) secret(s)"

      - name: Replace placeholders using fetched secrets
        if: inputs.secret-placeholders != ''
        uses: ignitia-core/ignitia-cicd-actions/common-replace-placeholders@master
        with:
          directory: workflow/repository
          replacements-in: ${{ steps.placeholders.outputs.keys }}
          replacements-out: ${{ steps.placeholders.outputs.values }}

      # -------------------- Versioning --------------------
      - name: Generate Semantic Version with GitVersion
        id: semver
        uses: ignitia-core/ignitia-cicd-actions/gitversion-generate-semver@master

      # -------------------- Quasar Build --------------------
      - name: Use project-level .npmrc if present
        run: |
          if [ -f "workflow/repository/.npmrc" ]; then
            echo "📦 Using repo .npmrc"
            cp "workflow/repository/.npmrc" ~/.npmrc
          else
            echo "ℹ️ No .npmrc found in project"
          fi
        shell: bash

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Quasar Build Web
        working-directory: ${{ inputs.source-folder }}
        run: |
          npm install
          npm i -g @quasar/cli
          npm run lint || true
          quasar build
        shell: bash

      - name: Package Web Output
        working-directory: ${{ inputs.source-folder }}/dist/spa
        run: |
          tar -czvf quasar-web.tar.gz ./*
          echo "✅ Created quasar-web.tar.gz"

      # -------------------- Post-publish: tag/release/cleanup/env bump --------------------
      - name: Create Tag & GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.github-pat.outputs.value }}
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@ignitia
        run: |
          set -euo pipefail
          cd workflow/repository
          
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          
          tag="${{ steps.semver.outputs.semantic-version }}"
          
          git tag -a "$tag" -m "Release $tag" -f
          git push "https://x-access-token:$GH_TOKEN@github.com/${{ inputs.repository }}" "+refs/tags/$tag"
          
          if gh release view "$tag" --repo "${{ inputs.repository }}" >/dev/null 2>&1; then
            echo "ℹ️ Release $tag already exists"
          else
            gh release create "$tag" \
              --repo "${{ inputs.repository }}" \
              --title "Release $tag" \
              --notes "Automated release from CI pipeline" \
              --verify-tag
            echo "✅ Created release $tag"
          fi

      - name: Upload quasar-web.tar.gz to S3 Registry
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        working-directory: ${{ inputs.source-folder }}/dist/spa
        run: |
          BUCKET_NAME="${{ inputs.application }}-registry"
          VERSION="${{ steps.semver.outputs.semantic-version }}"
          FILE_NAME="${VERSION}.tar.gz"
          
          aws s3 cp quasar-web.tar.gz "s3://${BUCKET_NAME}/${FILE_NAME}"
          
          echo "✅ Uploaded ${FILE_NAME} to s3://${BUCKET_NAME}"

      - name: Cleanup Old Releases & Tags
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: ignitia-core/ignitia-cicd-actions/github-clean-releases@master
        with:
          keep: 10
          token: ${{ steps.github-pat.outputs.value }}
          semantic-version: ${{ steps.semver.outputs.semantic-version }}
          clean-prereleases: "true"
          clean-old-releases: "true"

      - name: Bump -environment repo
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: ignitia-core/ignitia-cicd-actions/push-environment@master
        with:
          env-repo-name: ignitia-core/${{ inputs.application }}-${{ inputs.env-repo-suffix }}
          version: ${{ steps.semver.outputs.semantic-version }}
          type: "ui"
          token: ${{ steps.github-pat.outputs.value }}
