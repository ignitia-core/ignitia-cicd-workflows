name: Sync Environment Workflow (OIDC - API Only)

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      api-image-uri:
        description: The AWS ECR link to the Docker image repository.
        type: string
        required: true
      lambda-function:
        description: The name of the lambda function
        type: string
        required: true
      aws-role-arn:
        description: The ARN of the AWS IAM role to assume via OIDC
        type: string
        required: true
      aws-codeartifact-domain:
        type: string
        required: false
        default: "ignitia"
        description: "CodeArtifact domain name"
    secrets:
      aws-region:
        description: The region in AWS to push to
        required: true
      pat-github:
        description: GitHub PAT
        required: true

jobs:
  preparations:
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.set_vars.outputs.api_changed }}
      environment: ${{ steps.set_vars.outputs.environment }}
      api_version: ${{ steps.api-version.outputs.data }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Determine environment and detect changes
        id: set_vars
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Branch name: $BRANCH_NAME"
          
          # Determine environment based on branch
          if [ "$BRANCH_NAME" = "development" ]; then
            ENVIRONMENT="development"
          elif [ "$BRANCH_NAME" = "production" ]; then
            ENVIRONMENT="production"
          else
            echo "Error: Workflow only supports 'development' or 'production' branches"
            exit 1
          fi
          
          echo "Environment: $ENVIRONMENT"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          
          # Detect API changes
          API_CHANGED="false"
          if git diff HEAD^ HEAD --quiet -- ./version-api.yml ./$ENVIRONMENT.json; then
            echo "No API changes detected"
          else
            echo "API changes detected"
            API_CHANGED="true"
          fi
          echo "api_changed=$API_CHANGED" >> $GITHUB_OUTPUT
      
      - name: Read API version
        id: api-version
        if: steps.set_vars.outputs.api_changed == 'true'
        uses: KJ002/read-yaml@main
        with:
          file: "./version-api.yml"
          key-path: '["version"]'

  sync-api:
    needs: preparations
    if: needs.preparations.outputs.api_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ secrets.aws-region }}
      
      - name: Checkout platform tools
        uses: actions/checkout@v4
        with:
          repository: ignitia-core/ignitia-tools-generators-platform
          token: ${{ secrets.pat-github }}
          path: ./platform-tools
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      
      - name: Login to CodeArtifact
        run: |
          aws codeartifact login \
            --tool dotnet \
            --domain ${{ inputs.aws-codeartifact-domain }} \
            --repository ignitia-internal
          echo "✅ Logged in to CodeArtifact for NuGet packages"
      
      - name: Build platform CLI
        working-directory: ./platform-tools/Source
        run: |
          dotnet build Ignitia.Clis.Platform.sln -c Release
          dotnet publish Assemblies/Ignitia.Clis.Platform/Ignitia.Clis.Platform.csproj -c Release -o ../../cli-output
      
      - name: Checkout calling repository
        uses: actions/checkout@v4
        with:
          path: ./repo
      
      - name: Update Lambda environment variables
        working-directory: ./cli-output
        run: |
          dotnet Ignitia.Clis.Platform.dll aws-lambda-update-environment \
            --env-file ../repo/${{ needs.preparations.outputs.environment }}.json \
            --function-name ${{ inputs.lambda-function }}
      
      - name: Wait for Lambda configuration update
        run: sleep 40
      
      - name: Update Lambda container image
        working-directory: ./cli-output
        run: |
          dotnet Ignitia.Clis.Platform.dll aws-lambda-update-image \
            --image-uri ${{ inputs.api-image-uri }}:${{ needs.preparations.outputs.api_version }} \
            --function-name ${{ inputs.lambda-function }}
