name: Sync Environment Workflow

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      api-image-uri:
        description: The AWS ECR link to the Docker image repository.
        type: string
        required: true
      lambda-function:
        description: The name of the lambda function
        type: string
        required: true
      aws-region:
        description: The region in AWS to push to
        type: string
        required: true
      ui-repository:
        description: The GitHub repository for the UI (format owner/repo)
        type: string
        required: false
      s3-bucket:
        description: The S3 bucket name for UI deployment
        type: string
        required: false
      cloudfront-distribution:
        description: The CloudFront distribution ID
        type: string
        required: false

jobs:
  preparations:
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.set_vars.outputs.api_changed }}
      ui_changed: ${{ steps.set_vars.outputs.ui_changed }}
      environment: ${{ steps.set_vars.outputs.environment }}
      api_version: ${{ steps.api-version.outputs.data }}
      ui_version: ${{ steps.ui-version.outputs.data }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Determine environment and detect changes
        id: set_vars
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Branch name: $BRANCH_NAME"
          
          # Determine environment based on branch
          if [ "$BRANCH_NAME" = "development" ]; then
            ENVIRONMENT="development"
          elif [ "$BRANCH_NAME" = "production" ]; then
            ENVIRONMENT="production"
          else
            echo "Error: Workflow only supports 'development' or 'production' branches"
            exit 1
          fi
          
          echo "Environment: $ENVIRONMENT"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          
          # Detect API changes
          API_CHANGED="false"
          if git diff HEAD^ HEAD --quiet -- ./version-api.yml ./$ENVIRONMENT.json; then
            echo "No API changes detected"
          else
            echo "API changes detected"
            API_CHANGED="true"
          fi
          echo "api_changed=$API_CHANGED" >> $GITHUB_OUTPUT
          
          # Detect UI changes
          UI_CHANGED="false"
          if git diff HEAD^ HEAD --quiet -- ./version-ui.yaml; then
            echo "No UI changes detected"
          else
            echo "UI changes detected"
            UI_CHANGED="true"
          fi
          echo "ui_changed=$UI_CHANGED" >> $GITHUB_OUTPUT
      
      - name: Read API version
        id: api-version
        if: steps.set_vars.outputs.api_changed == 'true'
        uses: KJ002/read-yaml@main
        with:
          file: "./version-api.yml"
          key-path: '["version"]'
      
      - name: Read UI version
        id: ui-version
        if: steps.set_vars.outputs.ui_changed == 'true'
        uses: KJ002/read-yaml@main
        with:
          file: "./version-ui.yaml"
          key-path: '["version"]'

  sync-api:
    needs: preparations
    if: needs.preparations.outputs.api_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::246089461294:role/ignitia-github-cicd
          aws-region: ${{ inputs.aws-region }}
      
      - name: Update Lambda environment variables
        run: |
          # Convert each JSON key-value pair into an environment variable string, preserving quotes around string values
          env_vars=$(jq -r 'to_entries | map("\(.key)=\(.value|tojson)") | .[]' ${{ needs.preparations.outputs.environment }}.json)
          # Convert newline-separated key-value pairs to a comma-separated list
          env_vars_formatted=$(echo "$env_vars" | paste -sd, -)
          # Update the Lambda function configuration with the new environment variables
          aws lambda update-function-configuration --function-name ${{ inputs.lambda-function }} --environment "Variables={${env_vars_formatted}}"
          
          echo "✅ Updated Lambda environment variables"
      
      - name: Wait for Lambda configuration update
        run: |
          aws lambda wait function-updated --function-name ${{ inputs.lambda-function }}
          echo "✅ Lambda configuration update completed"
      
      - name: Update Lambda container image
        run: |
          aws lambda update-function-code \
            --function-name ${{ inputs.lambda-function }} \
            --image-uri ${{ inputs.api-image-uri }}:${{ needs.preparations.outputs.api_version }}
          
          echo "✅ Updated Lambda container image to version ${{ needs.preparations.outputs.api_version }}"

  sync-ui:
    needs: preparations
    if: needs.preparations.outputs.ui_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Download UI release
        uses: robinraju/release-downloader@v1.8
        with:
          repository: ${{ inputs.ui-repository }}
          tag: ${{ needs.preparations.outputs.ui_version }}
          fileName: "quasar-web.tar.gz"
          extract: true
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::246089461294:role/ignitia-github-cicd
          aws-region: ${{ inputs.aws-region }}
      
      - name: Push to Amazon S3
        run: |
          aws s3 sync ./ s3://${{ inputs.s3-bucket }} \
            --acl public-read \
            --follow-symlinks \
            --delete
          
          echo "✅ Synced UI to S3 bucket ${{ inputs.s3-bucket }}"
      
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ inputs.cloudfront-distribution }} \
            --paths "/*"
          
          echo "✅ Invalidated CloudFront distribution ${{ inputs.cloudfront-distribution }}"
