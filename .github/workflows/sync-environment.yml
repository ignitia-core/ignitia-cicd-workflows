name: Sync Environment Workflow (Platform CLI)

on:
  workflow_call:
    inputs:
      app-id:
        description: The unique app identifier in case of a mobile app.
        type: string
        required: true
      api-image-uri:
        description: The AWS ECR link to the Docker image repository.
        type: string
        required: true
      cloudfront-distribution:
        description: The ID of the AWS Cloudfront distribution
        type: string
        required: true
      lambda-function:
        description: The name of the lambda function
        type: string
        required: true
      s3-bucket:
        description: The name of the AWS S3 bucket
        type: string
        required: true
      ui-repository:
        description: The '[org]/[repository]' location of the UI repository
        type: string
        required: true
      platform-config:
        description: The platform configuration JSON
        type: string
        required: true
    secrets:
      aws-region:
        description: The region in AWS to push to
        required: true
      aws-access-key-id:
        description: The AWS Access Key ID
        required: true
      aws-secret-access-key:
        description: The AWS Secret Access Key
        required: true
      pat-github:
        description: GitHub PAT
        required: true

jobs:
  preparations:
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.set_vars.outputs.api_changed }}
      ui_changed: ${{ steps.set_vars.outputs.ui_changed }}
      environment: ${{ steps.set_vars.outputs.environment }}
      api_version: ${{ steps.api-version.outputs.data }}
      ui_version: ${{ steps.ui-version.outputs.data }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Determine environment and detect changes
        id: set_vars
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Branch name: $BRANCH_NAME"
          
          # Determine environment based on branch
          if [ "$BRANCH_NAME" = "development" ]; then
            ENVIRONMENT="development"
          elif [ "$BRANCH_NAME" = "production" ]; then
            ENVIRONMENT="production"
          else
            echo "Error: Workflow only supports 'development' or 'production' branches"
            exit 1
          fi
          
          echo "Environment: $ENVIRONMENT"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          
          # Detect API changes
          API_CHANGED="false"
          if git diff HEAD^ HEAD --quiet -- ./version-api.yml ./$ENVIRONMENT.json; then
            echo "No API changes detected"
          else
            echo "API changes detected"
            API_CHANGED="true"
          fi
          echo "api_changed=$API_CHANGED" >> $GITHUB_OUTPUT
          
          # Detect UI changes
          UI_CHANGED="false"
          if git diff HEAD^ HEAD --quiet -- ./version-ui.yml; then
            echo "No UI changes detected"
          else
            echo "UI changes detected"
            UI_CHANGED="true"
          fi
          echo "ui_changed=$UI_CHANGED" >> $GITHUB_OUTPUT
      
      - name: Read API version
        id: api-version
        if: steps.set_vars.outputs.api_changed == 'true'
        uses: KJ002/read-yaml@main
        with:
          file: "./version-api.yml"
          key-path: '["version"]'
      
      - name: Read UI version
        id: ui-version
        if: steps.set_vars.outputs.ui_changed == 'true'
        uses: KJ002/read-yaml@main
        with:
          file: "./version-ui.yml"
          key-path: '["version"]'

  sync-api:
    needs: preparations
    if: needs.preparations.outputs.api_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform tools
        uses: actions/checkout@v4
        with:
          repository: ignitia-core/ignitia-tools-generators-platform
          token: ${{ secrets.pat-github }}
          path: ./platform-tools
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      
      - name: Build platform CLI
        working-directory: ./platform-tools/Source
        run: |
          dotnet build Ignitia.Clis.Platform.sln -c Release
          dotnet publish Assemblies/Ignitia.Clis.Platform/Ignitia.Clis.Platform.csproj -c Release -o ../../cli-output
      
      - name: Checkout calling repository
        uses: actions/checkout@v4
        with:
          path: ./repo
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
          aws-region: ${{ secrets.aws-region }}
      
      - name: Update Lambda environment variables
        working-directory: ./cli-output
        run: |
          dotnet Ignitia.Clis.Platform.dll aws-lambda-update-environment \
            --config '${{ inputs.platform-config }}' \
            --environment ${{ needs.preparations.outputs.environment }} \
            --env-file ../repo/${{ needs.preparations.outputs.environment }}.json \
            --function-name ${{ inputs.lambda-function }}
      
      - name: Wait for Lambda configuration update
        run: sleep 40
      
      - name: Update Lambda container image
        working-directory: ./cli-output
        run: |
          dotnet Ignitia.Clis.Platform.dll aws-lambda-update-image \
            --config '${{ inputs.platform-config }}' \
            --environment ${{ needs.preparations.outputs.environment }} \
            --image-uri ${{ inputs.api-image-uri }}:${{ needs.preparations.outputs.api_version }} \
            --function-name ${{ inputs.lambda-function }}

  sync-ui:
    needs: preparations
    if: needs.preparations.outputs.ui_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform tools
        uses: actions/checkout@v4
        with:
          repository: ignitia-core/ignitia-tools-generators-platform
          token: ${{ secrets.pat-github }}
          path: ./platform-tools
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      
      - name: Build platform CLI
        working-directory: ./platform-tools/Source
        run: |
          dotnet build Ignitia.Clis.Platform.sln -c Release
          dotnet publish Assemblies/Ignitia.Clis.Platform/Ignitia.Clis.Platform.csproj -c Release -o ../../cli-output
      
      - name: Download UI release artifact
        uses: robinraju/release-downloader@v1.11
        with:
          repository: ${{ inputs.ui-repository }}
          tag: ${{ needs.preparations.outputs.ui_version }}
          fileName: "quasar-web.tar.gz"
          extract: true
          token: ${{ secrets.pat-github }}
          out-file-path: ./ui-dist
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
          aws-region: ${{ secrets.aws-region }}
      
      - name: Sync UI to S3
        working-directory: ./cli-output
        run: |
          dotnet Ignitia.Clis.Platform.dll aws-s3-sync \
            --config '${{ inputs.platform-config }}' \
            --source ../ui-dist \
            --bucket ${{ inputs.s3-bucket }} \
            --delete \
            --acl public-read
      
      - name: Invalidate CloudFront cache
        working-directory: ./cli-output
        run: |
          dotnet Ignitia.Clis.Platform.dll aws-cloudfront-invalidate \
            --config '${{ inputs.platform-config }}' \
            --distribution-id ${{ inputs.cloudfront-distribution }} \
            --paths "/*" \
            --wait
